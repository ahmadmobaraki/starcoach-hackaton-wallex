[project]
name = "wallex-trader"
version = "0.1.0"
description = "ARGUS - auditable AI trading agent for Wallex spot markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "httpx[http2]>=0.27,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "orjson>=3.10,<4",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.31,<1",
  "uvloop>=0.20,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
argus = "wallex_trader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallex_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["live: calls real Wallex/DeepSeek APIs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "SIM", "ASYNC109", "ASYNC230", "ASYNC240", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["wallex_trader"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
mypy_path = "src"
